<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseTEXT · leaderboard</title>
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0c0f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="top">
      <p class="brand"><a href="./" class="brand-link">PulseTEXT</a> <span class="muted">/ board</span></p>
      <div class="top-actions">
        <a class="ghost desk-only" href="/ops">Show desk</a>
        <button type="button" id="refreshBtn" class="btn">Refresh</button>
      </div>
    </header>

    <main class="ops-main">
      <p class="eyebrow">Leaderboard</p>
      <h1>Top callers</h1>
      <p class="lede narrow">Ranked by amount spent to get on air.</p>
      <div class="board-range" role="tablist" aria-label="Leaderboard range">
        <button type="button" class="board-range-btn is-on" data-range="all" role="tab" aria-selected="true">
          All time
        </button>
        <button type="button" class="board-range-btn" data-range="today" role="tab" aria-selected="false">
          Today
        </button>
      </div>

      <section class="panel table-panel board-panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Lines</th>
                <th>Spent</th>
              </tr>
            </thead>
            <tbody id="boardRows">
              <tr>
                <td colspan="5" class="muted">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./config.js"></script>
    <script type="module" src="./board.js"></script>
  </body>
</html>
